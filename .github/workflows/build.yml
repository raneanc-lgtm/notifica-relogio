          cat > app/src/main/java/com/slimcreative/relogio/MainActivity.java <<'XEOF'
          package com.slimcreative.relogio;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          @SuppressLint({"MissingPermission", "SetTextI18n"})
          public class MainActivity extends Activity {
              private static final int BG = Color.parseColor("#121212");
              private static final int CARD = Color.parseColor("#1E1E1E");
              private static final int ACCENT = Color.parseColor("#25D366");

              private final Handler h = new Handler(Looper.getMainLooper());
              private TextView statusTv, notifTv, watchTv;
              private LinearLayout scanList, appsBox;
              private Button scanBtn;
              private boolean scanning;
              private final Map<String, String> found = new LinkedHashMap<>();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(16);
                  root.setPadding(pad, pad, pad, pad);
                  sv.addView(root);

                  TextView title = text("Notifica Relógio", 24, Color.WHITE);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);
                  statusTv = text("", 15, ACCENT);
                  statusTv.setPadding(0, dp(4), 0, dp(12));
                  root.addView(statusTv);

                  // 1. acesso as notificacoes
                  LinearLayout c1 = card(root, "1. Acesso às notificações");
                  notifTv = text("", 14, Color.LTGRAY);
                  c1.addView(notifTv);
                  c1.addView(button("Abrir configuração", v ->
                          startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))));

                  // 2. relogio
                  LinearLayout c2 = card(root, "2. Relógio");
                  watchTv = text("", 14, Color.LTGRAY);
                  c2.addView(watchTv);
                  scanBtn = button("Procurar relógio", v -> startScan());
                  c2.addView(scanBtn);
                  scanList = new LinearLayout(this);
                  scanList.setOrientation(LinearLayout.VERTICAL);
                  c2.addView(scanList);

                  // 3. apps
                  LinearLayout c3 = card(root, "3. Apps que vibram no relógio");
                  appsBox = new LinearLayout(this);
                  appsBox.setOrientation(LinearLayout.VERTICAL);
                  c3.addView(appsBox);
                  Button showApps = button("Escolher apps", null);
                  showApps.setOnClickListener(v -> { loadApps(); showApps.setVisibility(View.GONE); });
                  c3.addView(showApps);

                  // 4. teste
                  LinearLayout c4 = card(root, "4. Teste");
                  c4.addView(button("Mandar teste pro relógio", v -> {
                      WatchLink.get(this).sendNotification(Packet.APP_WHATSAPP, "Teste", "Funcionou!");
                      Toast.makeText(this, "Enviado", Toast.LENGTH_SHORT).show();
                  }));

                  setContentView(sv);
                  askPermissions();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  boolean ok = notifAccess();
                  notifTv.setText(ok ? "Liberado ✔" : "Ainda não liberado: toque abaixo e ative \"Notifica Relógio\"");
                  notifTv.setTextColor(ok ? ACCENT : Color.parseColor("#FF8A65"));
                  String n = Prefs.name(this), mac = Prefs.mac(this);
                  watchTv.setText(mac == null ? "Nenhum escolhido" : "Escolhido: " + (n == null ? "?" : n) + " (" + mac + ")");
                  WatchLink link = WatchLink.get(this);
                  link.setListener(s -> statusTv.setText("Status: " + s));
                  if (hasBtPerms()) link.ensureConnected();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  WatchLink.get(this).setListener(null);
                  stopScan();
              }

              private boolean notifAccess() {
                  String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  ComponentName me = new ComponentName(this, NotifService.class);
                  return flat != null && flat.contains(me.flattenToString());
              }

              // ---------- permissoes ----------
              private String[] btPerms() {
                  if (Build.VERSION.SDK_INT >= 31)
                      return new String[]{"android.permission.BLUETOOTH_SCAN", "android.permission.BLUETOOTH_CONNECT"};
                  return new String[]{Manifest.permission.ACCESS_FINE_LOCATION};
              }

              private boolean hasBtPerms() {
                  for (String p : btPerms())
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) return false;
                  return true;
              }

              private void askPermissions() {
                  if (!hasBtPerms()) requestPermissions(btPerms(), 1);
              }

              @Override
              public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
                  if (hasBtPerms()) WatchLink.get(this).ensureConnected();
                  else Toast.makeText(this, "Sem a permissão de Bluetooth o app não consegue falar com o relógio", Toast.LENGTH_LONG).show();
              }

              // ---------- busca do relogio ----------
              private final ScanCallback scanCb = new ScanCallback() {
                  @Override
                  public void onScanResult(int type, ScanResult r) {
                      BluetoothDevice d = r.getDevice();
                      String name = r.getScanRecord() != null ? r.getScanRecord().getDeviceName() : null;
                      if (name == null) name = d.getName();
                      if (TextUtils.isEmpty(name) || found.containsKey(d.getAddress())) return;
                      found.put(d.getAddress(), name);
                      addFound(d.getAddress(), name);
                  }
              };

              private void startScan() {
                  if (!hasBtPerms()) { askPermissions(); return; }
                  BluetoothManager bm = (BluetoothManager) getSystemService(BLUETOOTH_SERVICE);
                  BluetoothAdapter ad = bm.getAdapter();
                  if (ad == null || !ad.isEnabled()) {
                      Toast.makeText(this, "Liga o Bluetooth primeiro", Toast.LENGTH_LONG).show();
                      return;
                  }
                  BluetoothLeScanner sc = ad.getBluetoothLeScanner();
                  if (sc == null || scanning) return;
                  found.clear();
                  scanList.removeAllViews();
                  scanList.addView(text("Procurando… (deixa o relógio perto e com a tela acesa)", 13, Color.GRAY));
                  scanning = true;
                  scanBtn.setEnabled(false);
                  sc.startScan(null, new ScanSettings.Builder().setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY).build(), scanCb);
                  h.postDelayed(this::stopScan, 12000);
              }

              private void stopScan() {
                  if (!scanning) return;
                  scanning = false;
                  scanBtn.setEnabled(true);
                  try {
                      BluetoothManager bm = (BluetoothManager) getSystemService(BLUETOOTH_SERVICE);
                      BluetoothLeScanner sc = bm.getAdapter().getBluetoothLeScanner();
                      if (sc != null) sc.stopScan(scanCb);
                  } catch (Exception ignored) {}
                  if (scanList.getChildCount() == 1 && found.isEmpty()) {
                      scanList.removeAllViews();
                      scanList.addView(text("Não achei nada. Se o MActivePro ainda estiver conectado no relógio, desinstala ele e tenta de novo.", 13, Color.parseColor("#FF8A65")));
                  }
              }

              private void addFound(String mac, String name) {
                  if (scanList.getChildCount() == 1 && scanList.getChildAt(0) instanceof TextView
                          && !(scanList.getChildAt(0) instanceof Button)) scanList.removeAllViews();
                  boolean likely = name.toLowerCase().contains("watch");
                  Button b = button((likely ? "⌚ " : "") + name + "  •  " + mac, v -> {
                      Prefs.setWatch(this, mac, name);
                      stopScan();
                      scanList.removeAllViews();
                      watchTv.setText("Escolhido: " + name + " (" + mac + ")");
                      WatchLink.get(this).disconnect();
                      WatchLink.get(this).ensureConnected();
                  });
                  if (likely) scanList.addView(b, 0); else scanList.addView(b);
              }

              // ---------- lista de apps ----------
              private void loadApps() {
                  PackageManager pm = getPackageManager();
                  Intent i = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> list = pm.queryIntentActivities(i, 0);
                  Map<String, String> apps = new LinkedHashMap<>();
                  for (ResolveInfo ri : list) {
                      String pkg = ri.activityInfo.packageName;
                      if (pkg.equals(getPackageName())) continue;
                      apps.put(pkg, String.valueOf(ri.loadLabel(pm)));
                  }
                  List<Map.Entry<String, String>> sorted = new ArrayList<>(apps.entrySet());
                  Set<String> sel = Prefs.apps(this);
                  Collections.sort(sorted, (a, b) -> {
                      boolean sa = sel.contains(a.getKey()), sb = sel.contains(b.getKey());
                      if (sa != sb) return sa ? -1 : 1;
                      return a.getValue().compareToIgnoreCase(b.getValue());
                  });
                  appsBox.removeAllViews();
                  for (Map.Entry<String, String> e : sorted) {
                      CheckBox cb = new CheckBox(this);
                      cb.setText(e.getValue());
                      cb.setTextColor(Color.WHITE);
                      cb.setChecked(sel.contains(e.getKey()));
                      cb.setOnCheckedChangeListener((v, on) -> {
                          Set<String> s = new HashSet<>(Prefs.apps(this));
                          if (on) s.add(e.getKey()); else s.remove(e.getKey());
                          Prefs.setApps(this, s);
                      });
                      appsBox.addView(cb);
                  }
              }

              // ---------- helpers de tela ----------
              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              private TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  return t;
              }

              private Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
                  if (l != null) b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(6);
                  b.setLayoutParams(lp);
                  return b;
              }

              private LinearLayout card(LinearLayout root, String title) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setBackgroundColor(CARD);
                  int p = dp(14);
                  c.setPadding(p, p, p, p);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.bottomMargin = dp(12);
                  root.addView(c, lp);
                  TextView t = text(title, 17, Color.WHITE);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, 0, 0, dp(6));
                  c.addView(t);
                  return c;
              }
          }
          XEOF
          cat > app/src/main/java/com/slimcreative/relogio/NotifService.java <<'XEOF'
          package com.slimcreative.relogio;

          import android.app.Notification;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import java.util.Set;

          /** O Android chama isso a cada notificacao nova. Nada fica rodando em loop. */
          public class NotifService extends NotificationListenerService {
              private String lastKey = "";
              private long lastTime;

              @Override
              public void onListenerConnected() {
                  WatchLink.get(this).ensureConnected();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null || sbn.isOngoing()) return;
                  Set<String> apps = Prefs.apps(this);
                  if (!apps.contains(sbn.getPackageName())) return;

                  Notification n = sbn.getNotification();
                  if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return; // "Novas mensagens: 5"

                  Bundle ex = n.extras;
                  String title = str(ex.getCharSequence(Notification.EXTRA_TITLE));
                  String text = str(ex.getCharSequence(Notification.EXTRA_TEXT));
                  if (text.isEmpty()) text = str(ex.getCharSequence(Notification.EXTRA_BIG_TEXT));
                  if (title.isEmpty() && text.isEmpty()) return;

                  // evita vibrar 2x pela mesma mensagem
                  String key = sbn.getPackageName() + "|" + title + "|" + text;
                  long now = System.currentTimeMillis();
                  if (key.equals(lastKey) && now - lastTime < 5000) return;
                  lastKey = key;
                  lastTime = now;

                  WatchLink.get(this).sendNotification(Packet.APP_WHATSAPP, title, text);
              }

              private static String str(CharSequence cs) { return cs == null ? "" : cs.toString().trim(); }
          }
          XEOF
          cat > app/src/main/java/com/slimcreative/relogio/Packet.java <<'XEOF'
          package com.slimcreative.relogio;

          import java.nio.charset.StandardCharsets;

          /**
           * Formato capturado do app MActivePro (log NJJ_BLE):
           *   BC 0B 02 [len] | 0B [app] [tamMsg] "Titulo: mensagem" | [checksum]
           * len      = tamanho do bloco de dados (tudo entre len e checksum)
           * tamMsg   = tamanho em bytes so da mensagem (parte depois de "Titulo: ")
           * checksum = soma dos bytes do bloco de dados (8 bits)
           * app 0x0A = WhatsApp (unico codigo confirmado na captura)
           */
          public final class Packet {
              public static final int APP_WHATSAPP = 0x0A;

              private Packet() {}

              /** maxPayload = espaco maximo pro bloco de dados (limitado pelo MTU e por 255). */
              public static byte[] notification(int appCode, String title, String body, int maxPayload) {
                  if (title == null) title = "";
                  if (body == null) body = "";
                  int limit = Math.min(255, maxPayload);
                  byte[] prefix = (title + ": ").getBytes(StandardCharsets.UTF_8);
                  if (prefix.length > limit - 3 - 4) {
                      prefix = cut(prefix, Math.max(0, limit - 3 - 4));
                  }
                  byte[] msg = body.getBytes(StandardCharsets.UTF_8);
                  int room = limit - 3 - prefix.length;
                  if (msg.length > room) msg = cut(msg, Math.max(0, room));
                  if (msg.length > 255) msg = cut(msg, 255);

                  int payloadLen = 3 + prefix.length + msg.length;
                  byte[] out = new byte[4 + payloadLen + 1];
                  out[0] = (byte) 0xBC;
                  out[1] = 0x0B;
                  out[2] = 0x02;
                  out[3] = (byte) payloadLen;
                  int p = 4;
                  out[p++] = 0x0B;
                  out[p++] = (byte) appCode;
                  out[p++] = (byte) msg.length;
                  System.arraycopy(prefix, 0, out, p, prefix.length);
                  p += prefix.length;
                  System.arraycopy(msg, 0, out, p, msg.length);
                  p += msg.length;
                  int sum = 0;
                  for (int i = 4; i < p; i++) sum += out[i] & 0xFF;
                  out[p] = (byte) sum;
                  return out;
              }

              /** Corta sem quebrar um caractere UTF-8 no meio. */
              static byte[] cut(byte[] src, int max) {
                  if (src.length <= max) return src;
                  int end = max;
                  while (end > 0 && (src[end] & 0xC0) == 0x80) end--;
                  byte[] r = new byte[end];
                  System.arraycopy(src, 0, r, 0, end);
                  return r;
              }

              public static String hex(byte[] b) {
                  StringBuilder sb = new StringBuilder();
                  for (byte x : b) sb.append(String.format("%02X", x & 0xFF));
                  return sb.toString();
              }
          }
          XEOF
          cat > app/src/main/java/com/slimcreative/relogio/Prefs.java <<'XEOF'
          package com.slimcreative.relogio;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.HashSet;
          import java.util.Set;

          public final class Prefs {
              private Prefs() {}

              private static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("relogio", Context.MODE_PRIVATE);
              }

              public static String mac(Context c) { return sp(c).getString("mac", null); }

              public static String name(Context c) { return sp(c).getString("name", null); }

              public static void setWatch(Context c, String mac, String name) {
                  sp(c).edit().putString("mac", mac).putString("name", name).apply();
              }

              /** Apps cujas notificacoes vao pro relogio. Padrao: WhatsApp e WhatsApp Business. */
              public static Set<String> apps(Context c) {
                  Set<String> def = new HashSet<>();
                  def.add("com.whatsapp");
                  def.add("com.whatsapp.w4b");
                  return new HashSet<>(sp(c).getStringSet("apps", def));
              }

              public static void setApps(Context c, Set<String> apps) {
                  sp(c).edit().putStringSet("apps", new HashSet<>(apps)).apply();
              }
          }
          XEOF
          cat > app/src/main/java/com/slimcreative/relogio/WatchLink.java <<'XEOF'
          package com.slimcreative.relogio;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;

          import java.util.ArrayDeque;
          import java.util.UUID;

          /** Conexao BLE com o relogio. Fica parada esperando; o Android reconecta sozinho (autoConnect). */
          @SuppressLint("MissingPermission")
          public final class WatchLink {
              static final String TAG = "RelogioLink";
              static final UUID SERVICE = UUID.fromString("000001ff-3c17-d293-8e48-14fe2e4da212");
              static final UUID WRITE_CHAR = UUID.fromString("0000ff02-0000-1000-8000-00805f9b34fb");

              public interface Listener { void onStatus(String status); }

              private static WatchLink instance;

              public static synchronized WatchLink get(Context c) {
                  if (instance == null) instance = new WatchLink(c.getApplicationContext());
                  return instance;
              }

              private final Context ctx;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final ArrayDeque<String[]> queue = new ArrayDeque<>();
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;
              private String connectedMac;
              private int mtu = 23;
              private boolean writing;
              private volatile String status = "Desconectado";
              private Listener listener;

              private WatchLink(Context c) { ctx = c; }

              public void setListener(Listener l) { listener = l; if (l != null) l.onStatus(status); }

              public String getStatus() { return status; }

              private void setStatus(String s) {
                  status = s;
                  Log.i(TAG, s);
                  final Listener l = listener;
                  if (l != null) main.post(() -> l.onStatus(s));
              }

              /** Garante que existe uma conexao (ou pedido de conexao) com o relogio salvo. */
              public synchronized void ensureConnected() {
                  String mac = Prefs.mac(ctx);
                  if (mac == null) { setStatus("Nenhum relógio escolhido"); return; }
                  if (gatt != null && mac.equals(connectedMac)) return;
                  disconnect();
                  BluetoothManager bm = (BluetoothManager) ctx.getSystemService(Context.BLUETOOTH_SERVICE);
                  BluetoothAdapter ad = bm == null ? null : bm.getAdapter();
                  if (ad == null || !ad.isEnabled()) { setStatus("Bluetooth desligado"); return; }
                  try {
                      BluetoothDevice dev = ad.getRemoteDevice(mac);
                      connectedMac = mac;
                      setStatus("Procurando o relógio…");
                      gatt = dev.connectGatt(ctx, true, callback, BluetoothDevice.TRANSPORT_LE);
                  } catch (Exception e) {
                      setStatus("Erro ao conectar: " + e.getMessage());
                      gatt = null;
                  }
              }

              public synchronized void disconnect() {
                  if (gatt != null) {
                      try { gatt.disconnect(); gatt.close(); } catch (Exception ignored) {}
                  }
                  gatt = null;
                  writeChar = null;
                  connectedMac = null;
                  writing = false;
                  mtu = 23;
              }

              public synchronized boolean isReady() { return writeChar != null; }

              /** Coloca uma notificacao na fila de envio. */
              public synchronized void sendNotification(int app, String title, String body) {
                  queue.add(new String[]{String.valueOf(app), title, body});
                  while (queue.size() > 10) queue.poll();
                  ensureConnected();
                  pump();
              }

              private synchronized void pump() {
                  if (writing || writeChar == null || gatt == null || queue.isEmpty()) return;
                  String[] n = queue.poll();
                  byte[] pkt = Packet.notification(Integer.parseInt(n[0]), n[1], n[2], mtu - 3 - 5);
                  writeChar.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                  writeChar.setValue(pkt);
                  writing = gatt.writeCharacteristic(writeChar);
                  Log.i(TAG, "envio " + Packet.hex(pkt) + " ok=" + writing);
                  if (!writing) main.postDelayed(this::pump, 500);
              }

              private final BluetoothGattCallback callback = new BluetoothGattCallback() {
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int st, int newState) {
                      if (newState == BluetoothProfile.STATE_CONNECTED) {
                          setStatus("Conectado, preparando…");
                          if (!g.requestMtu(247)) g.discoverServices();
                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                          synchronized (WatchLink.this) { writeChar = null; writing = false; mtu = 23; }
                          setStatus("Relógio fora de alcance (reconecta sozinho)");
                          if (st != BluetoothGatt.GATT_SUCCESS && g == gatt) {
                              // erro de conexao: fecha e tenta de novo daqui a pouco
                              synchronized (WatchLink.this) { disconnect(); }
                              main.postDelayed(WatchLink.this::ensureConnected, 15000);
                          }
                      }
                  }

                  @Override
                  public void onMtuChanged(BluetoothGatt g, int newMtu, int st) {
                      if (st == BluetoothGatt.GATT_SUCCESS) mtu = newMtu;
                      g.discoverServices();
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int st) {
                      BluetoothGattService s = g.getService(SERVICE);
                      BluetoothGattCharacteristic c = s == null ? null : s.getCharacteristic(WRITE_CHAR);
                      if (c == null) { setStatus("Esse aparelho não parece ser o relógio certo"); return; }
                      synchronized (WatchLink.this) { writeChar = c; writing = false; }
                      setStatus("Conectado ✔");
                      pump();
                  }

                  @Override
                  public void onCharacteristicWrite(BluetoothGatt g, BluetoothGattCharacteristic c, int st) {
                      synchronized (WatchLink.this) { writing = false; }
                      if (st != BluetoothGatt.GATT_SUCCESS) Log.w(TAG, "falha na escrita: " + st);
                      pump();
                  }
              };
          }
          XEOF
          echo '' | base64 -d > app/release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk NotificaRelogio.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Notifica Relógio v${{ github.run_number }}
          files: NotificaRelogio.apk
