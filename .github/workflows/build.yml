
name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o projeto
        run: |
          mkdir -p  app app/src/main app/src/main/java/com/slimcreative/relogio app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NotificaRelogio"
          include ":app"
          XEOF
          cat > build.gradle <<'XEOF'
          plugins { id "com.android.application" version "8.5.2" apply false }
          XEOF
          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          XEOF
          cat > app/build.gradle <<'XEOF'
          plugins { id "com.android.application" }

          android {
              namespace "com.slimcreative.relogio"
              compileSdk 34
              defaultConfig {
                  applicationId "com.slimcreative.relogio"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword "slimcreative"
                      keyAlias "slim"
                      keyPassword "slimcreative"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          XEOF
          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Notifica Relógio"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="Notifica Relógio"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
